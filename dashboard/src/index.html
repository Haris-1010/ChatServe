<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatServe Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Light by default; dark only if chosen before (no flash of the wrong theme)
      try { if (localStorage.getItem('chatserve.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
